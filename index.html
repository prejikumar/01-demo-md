<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Preview</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f7f7f7;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px;
      background: #fff;
      min-height: 100vh;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    pre,
    code {
      background: #f1f1f1;
      border-radius: 4px;
    }

    pre {
      padding: 12px;
      overflow-x: auto;
    }

    code {
      padding: 2px 4px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    blockquote {
      border-left: 4px solid #ddd;
      margin-left: 0;
      padding-left: 16px;
      color: #555;
    }
  </style>
</head>
<body>
  <main id="content">Loading...</main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('index.md')
      .then(function (response) {
        if (!response.ok) {
          throw new Error('Could not load index.md');
        }

        return response.text();
      })
      .then(function (markdown) {
        document.getElementById('content').innerHTML = marked.parse(markdown);
      })
      .catch(function (error) {
        document.getElementById('content').textContent =
          error.message + '. Run this folder through a local server instead of opening index.html directly.';
      });
  </script>
</body>
</html>
